name: Build and Test
description: Build and test project
inputs:
  dotnet-version:
    description: 'The version of .NET to use'
    required: true
  project-path:
    description: 'The project path of .NET to use'
    required: true
  install-wasm-tools:
    description: 'Install wasm-tools workload (required for Blazor WASM AOT)'
    required: false
    default: 'false'
  test-path:
    description: 'The test project to run (empty string skips the test step)'
    required: false
    default: 'src/allandeba.dev.br.Tests/allandeba.dev.br.Tests.csproj'

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Install wasm workload
      if: ${{ inputs.install-wasm-tools == 'true' }}
      run: dotnet workload install wasm-tools-net8
      shell: bash

    - name: Restore dependencies
      run: dotnet restore ${{ inputs.project-path }}
      shell: bash

    - name: Build
      run: dotnet build ${{ inputs.project-path }} --no-restore --configuration Release
      shell: bash

    - name: Run Unit Tests
      if: ${{ inputs.test-path != '' }}
      run: dotnet test ${{ inputs.test-path }} --configuration Release
      shell: bash
