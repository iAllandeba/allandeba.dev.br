    <script>
        (function () {
            try {
                var raw = localStorage.getItem('theme');
                var isDark;
                if (raw) {
                    var obj = JSON.parse(raw);
                    var decoded = atob(obj.value || obj.Value || '').replace(/"/g, '');
                    if (decoded === '2') {
                        isDark = true;
                    } else if (decoded === '1') {
                        isDark = false;
                    } else {
                        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    }
                } else {
                    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } catch (e) { }
        })();
    </script>
    <script>
        window.setHtmlLang = function (lang) { document.documentElement.lang = lang; };
        window.getHtmlLang = function () { return document.documentElement.lang || 'en'; };
        window.setMetaDescription = function (text) {
            var meta = document.querySelector('meta[name="description"]');
            if (meta) meta.setAttribute('content', text);
        };
        (function () {
            try {
                var raw = localStorage.getItem('lang');
                var lang;
                if (raw) {
                    var obj = JSON.parse(raw);
                    var decoded = atob(obj.value || obj.Value || '').replace(/"/g, '');
                    // ELanguageType: English = 0, Portuguese = 1
                    lang = decoded === '1' ? 'pt-BR' : 'en';
                } else {
                    var navLang = (navigator.language || 'en').toLowerCase();
                    lang = navLang.indexOf('pt') === 0 ? 'pt-BR' : 'en';
                }
                document.documentElement.lang = lang;
            } catch (e) { }
        })();
    </script>

    <div id="app"></div>

    <script>
        // Boot splash: static terminal loader shown before Blazor WASM finishes booting.
        // Kept until the app paints (its own loader on home, any content elsewhere),
        // then removed so there's no flash between splash and app.
        (function () {
            var splash = document.getElementById('boot-splash');
            if (!splash) return;

            if (document.documentElement.lang === 'pt-BR') {
                var cmd = splash.querySelector('.t-cmd');
                if (cmd) cmd.textContent = 'carregando';
            }

            var app = document.getElementById('app');
            var isHome = location.pathname === '/' || location.pathname === '';

            // True once Blazor has visibly taken over the page.
            function appHasPainted() {
                // Home: wait for the Blazor loader specifically — app chrome can
                // mount before it, and removing early would flash a blank page.
                if (document.getElementById('loader')) return true;
                // Other pages: any rendered child means Blazor is up.
                if (!isHome && app && app.firstElementChild) return true;
                // Error path: Blazor failed and showed its error UI.
                var errorUi = document.getElementById('blazor-error-ui');
                return !!(errorUi && getComputedStyle(errorUi).display !== 'none');
            }

            var observer = new MutationObserver(function () {
                if (appHasPainted()) removeSplash();
            });

            function removeSplash() {
                observer.disconnect();
                splash.remove();
            }

            observer.observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true,
                attributeFilter: ['style'] // catches blazor-error-ui becoming visible
            });

            if (appHasPainted()) removeSplash();
        })();
    </script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.

        <a class="dismiss">🗙</a>
    </div>
